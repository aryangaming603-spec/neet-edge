<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Edge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
    <h1>🧠 NEET EDGE OS</h1>

    <h2 id="greeting">Good Evening</h2>

    <p id="username">Aryan 👋</p>

    <div class="datetime">
        <span id="time">00:00:00</span>
        <br>
        <span id="date">Loading...</span>
    </div>
    </header>

    <div class="card">
    <h2>⏳ NEET 2027 Countdown</h2>
    <h3 id="countdown">Calculating...</h3>
    <p>Stay Consistent 💙</p>
    </div>

    <div class="card">
        <h2>🎯 Today's Goal</h2>
        <p>Study 12 Hours</p>
    </div>

    <div class="card">
        <h2>📚 Today's Tasks</h2>

        <label><input type="checkbox"> Physics</label><br>
        <label><input type="checkbox"> Chemistry</label><br>
        <label><input type="checkbox"> Biology</label>

    </div>

    <div class="card">
        <h2>🔥 Streak</h2>
        <p>0 Days</p>
    </div>

    <div class="card">
        <h2>📊 Progress</h2>
        <p>0%</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
