<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Center | NEET EDGE OS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/progress.css">
</head>

<body>

<nav class="navbar">

    <button onclick="history.back()">⬅</button>

    <h2>📊 Progress Center</h2>

    <button onclick="location.href='index.html'">🏠</button>

</nav>

<div class="container">

    <section class="card">

        <section class="card hero-card">

    <h2>🚀 NEET Progress</h2>

    <h1 id="heroPercent">64%</h1>

    <div class="progress">
        <div class="fill" id="heroBar"></div>
    </div>

    <div class="hero-stats">

        <div>
            <h4>🔥 Streak</h4>
            <p id="heroStreak">1 Day</p>
        </div>

        <div>
            <h4>📚 Chapters</h4>
            <p id="heroChapter">0 / 83</p>
        </div>

        <div>
            <h4>⏱ Hours</h4>
            <p id="heroHours">0</p>
        </div>

        <div>
            <h4>🎯 Target</h4>
            <p>AIR 1000</p>
        </div>

    </div>

        </section>

    <section class="card">

        <h3>📚 Overall Syllabus</h3>

        <div class="progress">
            <div class="fill" style="width:0%" id="overallProgress"></div>
        </div>

        <p id="overallText">0%</p>

    </section>

    <section class="card">

        <h3>⏱ Study Hours</h3>

        <p>Today : 0 Hours</p>

        <p>This Week : 0 Hours</p>

        <p>This Month : 0 Hours</p>

    </section>

</div>

<script src="js/progress-center.js"></script>

</body>
</html>
