<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEET EDGE OS</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="background"></div>

<div class="container">

<header>

<h1>🧠 NEET EDGE OS</h1>

<p id="greeting">Loading...</p>

<p class="username">Aryan 👋</p>

<div class="clock">

<h2 id="time">00:00:00</h2>

<p id="date">Loading...</p>

</div>

</header>


<!-- Mission -->

<div class="card">

<h3>🎯 Today's Mission</h3>

<p>Crack NEET 2027</p>

</div>


<!-- Countdown -->

<div class="card">

<h3>⏳ NEET Countdown</h3>

<h2 id="countdown">Loading...</h2>

</div>


<!-- Task Manager -->

<div class="card">

<h3>📋 Today's Tasks</h3>

<div id="taskList">

<label><input type="checkbox"> Physics</label>

<label><input type="checkbox"> Chemistry</label>

<label><input type="checkbox"> Biology</label>

</div>

<button id="addTask">
➕ Add Task
</button>

</div>


<!-- Focus Timer -->

<div class="card">

<h3>⏱ Focus Timer</h3>

<h2 id="timer">
25:00
</h2>

<div class="buttons">

<button id="startBtn">
▶ Start
</button>

<button id="pauseBtn">
⏸ Pause
</button>

<button id="resetBtn">
🔄 Reset
</button>

</div>

</div>


<!-- Progress -->

<div class="card">

<h3>📈 Today's Progress</h3>

<div class="progress">

<div class="fill"></div>

</div>

<p id="progressText">
0%
</p>

</div>


<!-- Chapter Tracker -->

<div class="card">

<h3>📚 Chapter Tracker</h3>

<p>Physics</p>

<div class="progress">

<div class="physics"></div>

</div>

<p>Chemistry</p>

<div class="progress">

<div class="chemistry"></div>

</div>

<p>Biology</p>

<div class="progress">

<div class="biology"></div>

</div>

</div>


<!-- Footer -->

<footer>

<p>
NEET EDGE OS v2.0 Alpha
</p>

</footer>

</div>

<script src="js/script.js"></script>

</body>

</html>
