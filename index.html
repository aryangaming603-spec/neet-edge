<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEET EDGE OS</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

<header>

<h1>🧠 NEET EDGE OS</h1>

<p id="greeting">Loading...</p>

<p id="username">Aryan 👋</p>

<div class="datetime">

<h2 id="time">00:00</h2>

<p id="date">Loading...</p>

</div>

</header>

<section class="card">

<h3>🎯 Mission</h3>

<p>Crack NEET 2027</p>

</section>

<section class="card">

<h3>⏳ Countdown</h3>

<h2 id="countdown">Loading...</h2>

</section>

<section class="card">

<h3>📚 Today's Tasks</h3>

<label><input type="checkbox"> Physics</label>

<label><input type="checkbox"> Chemistry</label>

<label><input type="checkbox"> Biology</label>

</section>

<section class="card">

<h3>🔥 Study Progress</h3>

<div class="progress">

<div class="fill"></div>

</div>

<p>0%</p>

</section>

<section class="card">

<h3>⏱ Focus Timer</h3>

<h2>00:00:00</h2>

<button>Start</button>

<button>Pause</button>

<button>Reset</button>

</section>

</div>

<script src="js/script.js"></script>

</body>

</html>
